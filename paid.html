<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>สถานะการชำระเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--success:#059669;--warning:#d97706;--danger:#dc2626;--bg:#f0f4f8;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
body{font-family:'Sarabun','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:16px;font-size:16px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px;text-align:center}
.icon{font-size:56px;line-height:1.2}
h1{font-size:22px;margin:8px 0}
.rid{display:inline-block;margin:10px 0;padding:8px 16px;border-radius:8px;background:#eff6ff;color:var(--primary);font-weight:800;font-size:18px;letter-spacing:.5px}
.desc{color:var(--muted);font-size:15px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:15px;text-align:left}
.row .l{color:var(--muted)}.row .v{font-weight:700}
.contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.contact a{flex:1;min-width:140px;text-align:center;padding:10px;border-radius:8px;background:#eff6ff;color:var(--primary);text-decoration:none;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:center}
.foot{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="status-card">
    <div class="icon">⏳</div>
    <h1>กำลังตรวจสอบการชำระเงิน…</h1>
    <div class="desc">กรุณารอสักครู่</div>
  </div>
  <div class="card">
    <div class="desc">มีคำถามเรื่องการเช่า/ชำระเงิน ติดต่อเจ้าหน้าที่พร้อมแจ้งเลขที่การจอง</div>
    <div class="contact">
      <a href="tel:0909791212">📞 โทร 090-979-1212</a>
      <a href="https://line.me/R/ti/p/@jiacpr" target="_blank" rel="noopener">💬 แชท LINE OA</a>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz-BdCSLYps-EY9cmrY2eBN6xZlTdEBDqeZSMZXKGbarfRhyNQUyeact_IOeqktJL2qTw/exec';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('th-TH');
const params=new URLSearchParams(location.search);
const sid=params.get('session_id')||'';
const cancelled=!!params.get('cancelled');
let tries=0;

function show(icon,title,desc,r){
  let rows='';
  if(r){
    rows=`<div style="margin-top:14px">
      <div class="row"><span class="l">ยอด</span><span class="v">฿${fmt(r.amount)}</span></div>
      ${r.depositAmount>0?`<div class="row"><span class="l">ในยอดนี้เป็นมัดจำ</span><span class="v">฿${fmt(r.depositAmount)}</span></div>`:''}
    </div>`;
  }
  document.getElementById('status-card').innerHTML=`<div class="icon">${icon}</div><h1>${title}</h1>${r&&r.rentalId?`<div class="rid">${esc(r.rentalId)}</div>`:''}<div class="desc">${desc}</div>${rows}`;
  if(r&&r.companyName){document.getElementById('foot').textContent=`ผู้รับเงิน: ${r.companyName}`;document.title=`สถานะการชำระเงิน | ${r.companyName}`;}
}

async function check(){
  if(!/^cs_[A-Za-z0-9_]+$/.test(sid)){show('❓','ไม่พบรายการชำระเงิน','ลิงก์ไม่ถูกต้อง กรุณาติดต่อเจ้าหน้าที่');return;}
  let r=null;
  try{
    const url=new URL(GAS_URL);url.searchParams.set('action','publicSessionStatus');url.searchParams.set('session_id',sid);
    r=await (await fetch(url.toString())).json();
  }catch(e){console.error(e);}
  if(!r||!r.ok){
    if(tries++<3){setTimeout(check,3000);return;}
    show('❓','ตรวจสอบสถานะไม่ได้','ถ้าชำระเงินแล้ว ระบบจะยืนยันให้อัตโนมัติภายในไม่กี่นาที — แจ้งเจ้าหน้าที่ได้ถ้ายังไม่ได้รับการยืนยัน');return;
  }
  const isHold=r.kind==='deposit_hold';
  if(r.status==='paid'){
    show('✅','ชำระเงินสำเร็จ',r.kind==='deposit_charge'?'ได้รับมัดจำแล้ว จะคืนผ่าน Stripe หลังรับอุปกรณ์คืน':'ได้รับการจองแล้ว เจ้าหน้าที่จะติดต่อยืนยันวันส่งของ',r);
  } else if(r.status==='hold'){
    show('✅','กันวงเงินมัดจำสำเร็จ','ยังไม่ได้ตัดเงินจริง — วงเงินจะถูกปล่อยเมื่อรับอุปกรณ์คืนในสภาพดี',r);
  } else if(r.status==='pending'||r.status==='processing'){
    if(cancelled){show('↩️','ยังไม่ได้ชำระเงิน','ยกเลิกการชำระเงินแล้ว — กลับไปเปิดลิงก์เดิมเพื่อชำระใหม่ได้ก่อนลิงก์หมดอายุ',r);return;}
    if(tries++<10){show('⏳','กำลังยืนยันการชำระเงิน…','รอสักครู่ หน้านี้จะอัปเดตเอง',r);setTimeout(check,3000);return;}
    show('⏳','รอยืนยันการชำระเงิน','ถ้าชำระแล้ว ระบบจะยืนยันให้อัตโนมัติภายใน 10–15 นาที',r);
  } else if(r.status==='expired'){
    show('⌛','ลิงก์ชำระเงินหมดอายุ','ยังไม่ได้ชำระเงิน กรุณาจองใหม่ หรือขอลิงก์ใหม่จากเจ้าหน้าที่',r);
  } else if(r.status==='released'){
    show('🔓','ปล่อยวงเงินแล้ว','วงเงินมัดจำถูกปล่อยคืนบัตรแล้ว',r);
  } else if(r.status==='captured'){
    show('ℹ️','ปิดรายการมัดจำแล้ว','หักค่าเสียหายบางส่วน ส่วนที่เหลือปล่อยคืนบัตรแล้ว',r);
  } else {
    show('⚠️','การชำระเงินไม่สำเร็จ','กรุณาลองใหม่ หรือติดต่อเจ้าหน้าที่',r);
  }
}
check();
</script>
</body>
</html>
